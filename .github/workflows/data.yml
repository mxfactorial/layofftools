name: data

on:
  pull_request:
    paths:
      - data/**
      - js/tools.js
      - js/groups.js
      - .github/workflows/data.yml
  push:
    branches: [main]
    paths:
      - data/**

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: tools schema
        run: npx -y ajv-cli@5 validate --spec=draft2020 -s data/tools.schema.json -d data/tools.json

      - name: groups schema
        run: npx -y ajv-cli@5 validate --spec=draft2020 -s data/groups.schema.json -d data/groups.json

      - name: no duplicates
        run: |
          node -e '
            const norm = (v) => v.toLowerCase().replace(/\/+$/, "")
            const checks = [
              ["tools", require("./data/tools.json").tools, ["name", "url"]],
              ["groups", require("./data/groups.json").groups, ["name", "url"]],
            ]
            let failed = false
            for (const [list, items, keys] of checks) {
              for (const key of keys) {
                const seen = new Set()
                for (const t of items) {
                  const v = norm(t[key])
                  if (seen.has(v)) { console.error(`duplicate ${list} ${key}: ${t[key]}`); failed = true }
                  seen.add(v)
                }
              }
            }
            process.exit(failed ? 1 : 0)
          '
